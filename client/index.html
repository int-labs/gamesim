<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Int Labs Academy · Notebook Business Sim</title>
    <meta
      name="description"
      content="A 90-day pixel-art notebook business simulator. Design products, manage stock, control cash, and learn how product-market fit, operations, and financials actually fit together. Free, browser-based."
    />
    <meta
      name="keywords"
      content="notebook business simulator, business sim game, pixel art game, browser business game, product market fit, P&L simulation, business education game, Int Labs Academy, notebook pixel sim, indie business game"
    />
    <meta name="author" content="Int Labs" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4ecd8" />
    <link rel="canonical" href="https://notebook-pixel-sim.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/img/notebook-core/student/student_angle_hardcover-ring_v01.png" />
    <link rel="apple-touch-icon" href="/img/notebook-core/student/student_angle_hardcover-ring_v01.png" />

    <!-- Pass Key gate backdrop — fetch early so the entry screen paints fast. -->
    <link rel="preload" as="image" href="/img/environment/pixelenterpin-background.png" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Int Labs Academy" />
    <meta property="og:title" content="Int Labs Academy · Notebook Business Sim" />
    <meta
      property="og:description"
      content="Run a 90-day pixel-art notebook business. Design products, watch your cash, finish profitable. Free in your browser."
    />
    <meta property="og:url" content="https://notebook-pixel-sim.vercel.app/" />
    <meta property="og:image" content="https://notebook-pixel-sim.vercel.app/img/logo.png" />
    <meta property="og:image:width" content="2044" />
    <meta property="og:image:height" content="446" />
    <meta property="og:image:alt" content="Int Labs Academy logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Int Labs Academy · Notebook Business Sim" />
    <meta
      name="twitter:description"
      content="Run a 90-day pixel-art notebook business. Design products, watch your cash, finish profitable. Free in your browser."
    />
    <meta name="twitter:image" content="https://notebook-pixel-sim.vercel.app/img/logo.png" />
    <meta name="twitter:image:alt" content="Int Labs Academy logo" />

    <!-- Fonts (preconnect first to cut TLS round-trip cost). Caveat is the
         pass-key panel's handwriting face — keep it in the family list. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Jura:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data — VideoGame schema lets Google + sharing previews
         render a richer card. Keep it concise and machine-friendly. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Int Labs Academy · Notebook Business Sim",
        "description": "A 90-day pixel-art notebook business simulator. Design products, manage stock, control cash, and finish profitable.",
        "url": "https://notebook-pixel-sim.vercel.app/",
        "image": "https://notebook-pixel-sim.vercel.app/img/logo.png",
        "applicationCategory": "Game",
        "genre": ["Business Simulation", "Educational", "Indie", "Pixel Art"],
        "operatingSystem": "Web Browser",
        "browserRequirements": "Requires JavaScript and a modern browser",
        "author": { "@type": "Organization", "name": "Int Labs" },
        "publisher": { "@type": "Organization", "name": "Int Labs" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This is an interactive notebook business simulator. Please enable JavaScript to play.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
