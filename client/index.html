<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>int labs. · Stratagem Console</title>

    <link rel="icon" href="/Logo.png" type="image/png" />

    <!--
      Anti-FOUC: resolve the stored theme before React mounts so the canvas
      never flashes white on a dark-theme load.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("il-theme") || "light";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.background = dark ? "#0e0e1c" : "#f7f7f9";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
